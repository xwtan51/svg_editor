name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  vscode-svg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-svg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-svg/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: vscode-svg/.vscode-test
          key: vscode-test-${{ runner.os }}-1.146.0
      - run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: 1.146.0

name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:scripts
      - name: npm run typecheck (through a symlinked path)
        run: |
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/repo-link"
          cd "$RUNNER_TEMP/repo-link"
          npm run typecheck
      - run: npm test
      - run: npm run baseline

  vscode-svg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-svg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-svg/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/cache@v5
        with:
          path: vscode-svg/.vscode-test
          key: vscode-test-${{ runner.os }}-1.146.0
      - run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: 1.146.0
